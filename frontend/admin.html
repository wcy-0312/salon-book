<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SalonBook 今日</title>

    <link
        rel="stylesheet"
        href="admin-app.css"
    >
</head>

<body>

    <main class="app-container">

        <!-- 問候 + 設計師切換 -->
        <header class="greeting-header">
            <div>
                <h1 class="brand-title">SalonBook</h1>

                <div class="staff-switcher-v2">
                    <span class="staff-greeting-prefix">早安，</span>
                    <select id="staff-select">
                        <option>載入中...</option>
                    </select>
                </div>

                <p class="staff-role" id="staff-role">髮型設計師</p>
            </div>
        </header>

        <p class="today-date" id="today-date">--</p>
        <p class="today-summary" id="today-summary">載入中...</p>


        <!-- 需要處理：待確認預約入口 -->
        <a
            id="pending-alert-card"
            href="#"
            class="alert-card"
            style="display: none;"
        >
            <span class="alert-card-icon">⏰</span>

            <span class="alert-card-body">
                <span class="alert-card-label">需要處理</span>
                <span class="alert-card-title">
                    待確認預約
                    <span
                        class="alert-card-count"
                        id="pending-alert-count"
                    >0</span>
                </span>
            </span>

            <span class="alert-card-chevron">›</span>
        </a>


        <!-- 下一位客人 -->
        <section class="app-section" id="next-customer-section" style="display: none;">

            <div class="app-section-header">
                <span class="app-section-title">下一位客人</span>
            </div>

            <a
                id="next-customer-card"
                href="#"
                class="next-card"
            >
                <span class="next-card-time-badge">📅</span>

                <span class="next-card-body">
                    <span class="next-card-time" id="next-customer-time">--:--</span>
                    <div class="next-card-name" id="next-customer-name">--</div>
                    <div class="next-card-meta" id="next-customer-meta">--</div>
                </span>

                <span class="next-card-chevron">›</span>
            </a>

        </section>


        <!-- 今日行程摘要 -->
        <section class="app-section">

            <div class="app-section-header">
                <span class="app-section-title" id="today-schedule-title">今日行程</span>
            </div>

            <div
                id="today-schedule-list"
                class="timeline-list"
            >
                <p class="state-message">載入中...</p>
            </div>

        </section>

    </main>


    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

        <a
            id="nav-today"
            href="admin.html"
            class="bottom-nav-item is-active"
        >
            <span class="bottom-nav-icon">🏠</span>
            今日
        </a>

        <span
            id="nav-calendar"
            class="bottom-nav-item is-disabled"
        >
            <span class="bottom-nav-icon">🗓️</span>
            行事曆
        </span>

        <a
            id="nav-services"
            href="services.html"
            class="bottom-nav-item"
        >
            <span class="bottom-nav-icon">✂️</span>
            服務
        </a>

        <a
            id="nav-management"
            href="staff.html"
            class="bottom-nav-item"
        >
            <span class="bottom-nav-icon">⚙️</span>
            管理
        </a>

    </nav>


    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="admin-common.js"></script>
    <script src="admin.js"></script>

</body>

</html>
