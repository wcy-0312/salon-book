<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SalonBook 營業時間</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >
</head>

<body>

    <main class="container">

        <header class="header">
            <div>
                <h1>營業時間</h1>
                <p><a href="admin.html">← 返回預約管理</a></p>
            </div>
        </header>


        <!-- 每週固定營業時間 -->
        <section class="section">

            <div class="section-header">
                <h2>每週營業時間</h2>
            </div>

            <div
                id="schedule-list"
                class="schedule-week-list"
            >
                <p class="loading">
                    載入中...
                </p>
            </div>

        </section>

    </main>


    <!-- 編輯營業時間彈窗 -->
    <div
        id="schedule-edit-overlay"
        class="service-edit-overlay hidden"
    >

        <div class="service-edit-dialog">

            <h2 id="schedule-edit-title">
                編輯營業時間
            </h2>

            <form id="schedule-edit-form">

                <label class="service-field service-field-checkbox">
                    <input
                        id="schedule-edit-open"
                        type="checkbox"
                    >
                    營業
                </label>

                <div
                    id="schedule-edit-time-fields"
                    class="service-field-row"
                >

                    <label class="service-field">
                        開始時間
                        <input
                            id="schedule-edit-start"
                            type="time"
                        >
                    </label>

                    <label class="service-field">
                        結束時間
                        <input
                            id="schedule-edit-end"
                            type="time"
                        >
                    </label>

                </div>

                <div class="service-edit-actions">

                    <button
                        type="button"
                        id="schedule-edit-cancel"
                        class="reject-button"
                    >
                        取消
                    </button>

                    <button
                        type="submit"
                        class="confirm-button"
                    >
                        儲存
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="schedule.js"></script>

</body>

</html>
