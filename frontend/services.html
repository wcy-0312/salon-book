<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SalonBook 服務管理</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >
</head>

<body>

    <main class="container">

        <header class="header">
            <div>
                <h1>服務管理</h1>
                <p><a href="admin.html">← 返回預約管理</a></p>
            </div>
        </header>


        <!-- 服務清單 -->
        <section class="section">

            <div class="section-header">
                <h2>所有服務</h2>
            </div>

            <div
                id="service-list"
                class="service-list"
            >
                <p class="loading">
                    載入中...
                </p>
            </div>

        </section>


        <!-- 新增服務 -->
        <section class="section">

            <div class="section-header">
                <h2>新增服務</h2>
            </div>

            <form
                id="service-form"
                class="service-form"
            >

                <label class="service-field">
                    名稱
                    <input
                        id="service-name"
                        type="text"
                        maxlength="50"
                        required
                    >
                </label>

                <div class="service-field-row">

                    <label class="service-field">
                        價格
                        <input
                            id="service-price"
                            type="number"
                            min="0"
                            step="1"
                            required
                        >
                    </label>

                    <label class="service-field">
                        所需時間（分鐘）
                        <input
                            id="service-duration"
                            type="number"
                            min="1"
                            step="1"
                            required
                        >
                    </label>

                </div>

                <button
                    type="submit"
                    class="service-submit"
                >
                    新增服務
                </button>

            </form>

        </section>

    </main>


    <!-- 編輯服務彈窗 -->
    <div
        id="service-edit-overlay"
        class="service-edit-overlay hidden"
    >

        <div class="service-edit-dialog">

            <h2>編輯服務</h2>

            <form id="service-edit-form">

                <label class="service-field">
                    名稱
                    <input
                        id="edit-service-name"
                        type="text"
                        maxlength="50"
                        required
                    >
                </label>

                <div class="service-field-row">

                    <label class="service-field">
                        價格
                        <input
                            id="edit-service-price"
                            type="number"
                            min="0"
                            step="1"
                            required
                        >
                    </label>

                    <label class="service-field">
                        所需時間（分鐘）
                        <input
                            id="edit-service-duration"
                            type="number"
                            min="1"
                            step="1"
                            required
                        >
                    </label>

                </div>

                <label class="service-field service-field-checkbox">
                    <input
                        id="edit-service-active"
                        type="checkbox"
                    >
                    啟用中
                </label>

                <div class="service-edit-actions">

                    <button
                        type="button"
                        id="service-edit-cancel"
                        class="reject-button"
                    >
                        取消
                    </button>

                    <button
                        type="submit"
                        class="confirm-button"
                    >
                        儲存
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="services.js"></script>

</body>

</html>
