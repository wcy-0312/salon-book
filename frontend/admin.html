<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SalonBook 管理</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >
</head>

<body>

    <main class="container">

        <header class="header">
            <div>
                <h1>SalonBook</h1>
                <p>Andy · 預約管理</p>
            </div>

            <button
                id="refresh-button"
                type="button"
                class="refresh-button"
            >
                重新整理
            </button>
        </header>


        <!-- 待確認：所有未來 PENDING，不受日期切換影響 -->
        <section class="section">

            <div class="section-header">

                <h2>待確認預約</h2>

                <span
                    id="pending-count"
                    class="count"
                >
                    0
                </span>

            </div>

            <div
                id="booking-list"
                class="booking-list"
            >
                <p class="loading">
                    載入中...
                </p>
            </div>

        </section>


        <!-- 近期預約：最近 10 筆 CONFIRMED，不受日期切換影響 -->
        <section class="section">

            <div class="section-header">

                <h2>近期預約</h2>

                <span
                    id="upcoming-count"
                    class="count count-secondary"
                >
                    0
                </span>

            </div>

            <div
                id="upcoming-list"
                class="booking-list"
            >
                <p class="loading">
                    載入中...
                </p>
            </div>

        </section>


        <!-- 日期導覽：僅影響下方「當日行程」 -->
        <section class="date-navigation">

            <button
                id="previous-date-button"
                type="button"
                class="date-button"
            >
                ‹
            </button>

            <div
                id="date-picker-button"
                class="current-date"
                role="button"
                tabindex="0"
            >
                <strong id="current-date-text">
                    --
                </strong>
            </div>

            <input
                id="date-picker"
                type="date"
                hidden
            >

            <button
                id="next-date-button"
                type="button"
                class="date-button"
            >
                ›
            </button>

        </section>


        <!-- 當日行程：目前選擇日期的 CONFIRMED -->
        <section class="section schedule-section">

            <div class="section-header">

                <h2>當日行程</h2>

                <span
                    id="schedule-count"
                    class="count count-secondary"
                >
                    0
                </span>

            </div>

            <div
                id="schedule-list"
                class="schedule-list"
            >
                <p class="loading">
                    載入中...
                </p>
            </div>

        </section>


        <!-- 休假管理 -->
        <section class="section">

            <div class="section-header">
                <h2>休假管理</h2>
            </div>

            <div class="calendar">

                <div class="calendar-header">

                    <button
                        id="calendar-prev-month"
                        type="button"
                        class="date-button"
                    >
                        ‹
                    </button>

                    <strong id="calendar-month-label">
                        --
                    </strong>

                    <button
                        id="calendar-next-month"
                        type="button"
                        class="date-button"
                    >
                        ›
                    </button>

                </div>

                <div class="calendar-weekdays">
                    <span>日</span>
                    <span>一</span>
                    <span>二</span>
                    <span>三</span>
                    <span>四</span>
                    <span>五</span>
                    <span>六</span>
                </div>

                <div
                    id="calendar-grid"
                    class="calendar-grid"
                >
                    <p class="loading">
                        載入中...
                    </p>
                </div>

                <p class="calendar-hint">
                    點擊日期即可設定或取消休假
                </p>

            </div>

        </section>

    </main>

    
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="admin.js"></script>

</body>

</html>
