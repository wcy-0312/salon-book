<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SalonBook 管理</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >
</head>

<body>

    <main class="container">

        <header class="header">
            <div>
                <h1>SalonBook</h1>
                <p>Andy · 預約管理</p>
            </div>

            <button
                id="refresh-button"
                type="button"
                class="refresh-button"
            >
                重新整理
            </button>
        </header>


        <!-- 日期導覽 -->
        <section class="date-navigation">

            <button
                id="previous-date-button"
                type="button"
                class="date-button"
            >
                ‹
            </button>

            <div
                id="date-picker-button"
                class="current-date"
                role="button"
                tabindex="0"
            >
                <strong id="current-date-text">
                    --
                </strong>
            </div>

            <input
                id="date-picker"
                type="date"
                hidden
            >

            <button
                id="next-date-button"
                type="button"
                class="date-button"
            >
                ›
            </button>

        </section>


        <!-- 待確認 -->
        <section class="section">

            <div class="section-header">

                <h2>待確認預約</h2>

                <span
                    id="pending-count"
                    class="count"
                >
                    0
                </span>

            </div>

            <div
                id="booking-list"
                class="booking-list"
            >
                <p class="loading">
                    載入中...
                </p>
            </div>

        </section>


        <!-- 當日行程 -->
        <section class="section schedule-section">

            <div class="section-header">

                <h2>今日行程</h2>

                <span
                    id="schedule-count"
                    class="count count-secondary"
                >
                    0
                </span>

            </div>

            <div
                id="schedule-list"
                class="schedule-list"
            >
                <p class="loading">
                    載入中...
                </p>
            </div>

        </section>


        <!-- 休假 / 封鎖時段 -->
        <section class="section">

            <div class="section-header">

                <h2>休假 / 封鎖時段</h2>

                <span
                    id="blocked-time-count"
                    class="count count-secondary"
                >
                    0
                </span>

            </div>

            <div
                id="blocked-time-list"
                class="blocked-time-list"
            >
                <p class="loading">
                    載入中...
                </p>
            </div>

            <form
                id="blocked-time-form"
                class="blocked-time-form"
            >

                <label class="blocked-time-field blocked-time-field-checkbox">
                    <input
                        id="blocked-time-all-day"
                        type="checkbox"
                    >
                    整天休假
                </label>

                <div
                    id="blocked-time-range"
                    class="blocked-time-range"
                >

                    <label class="blocked-time-field">
                        開始
                        <input
                            id="blocked-time-start"
                            type="time"
                            required
                        >
                    </label>

                    <label class="blocked-time-field">
                        結束
                        <input
                            id="blocked-time-end"
                            type="time"
                            required
                        >
                    </label>

                </div>

                <label class="blocked-time-field">
                    原因（選填）
                    <input
                        id="blocked-time-reason"
                        type="text"
                        maxlength="100"
                        placeholder="例如：外出進修"
                    >
                </label>

                <button
                    type="submit"
                    class="blocked-time-submit"
                >
                    新增封鎖時段
                </button>

            </form>

        </section>

    </main>

    
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="admin.js"></script>

</body>

</html>
