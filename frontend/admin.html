<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SalonBook 今日</title>

    <link
        rel="stylesheet"
        href="admin-app.css"
    >
</head>

<body>

    <main class="app-container">

        <!-- 問候 + 設計師切換 -->
        <header class="greeting-header">
            <h1 class="brand-title">SalonBook</h1>

            <div class="staff-switcher-v2">
                <span class="staff-greeting-prefix">早安，</span>
                <select id="staff-select">
                    <option>載入中...</option>
                </select>
            </div>

            <p class="staff-role" id="staff-role">髮型設計師</p>
        </header>

        <div class="today-date-row">
            <span class="today-date" id="today-date">--</span>
        </div>
        <p class="today-summary" id="today-summary">載入中...</p>


        <!-- 需要處理：待確認預約入口 -->
        <a
            id="pending-alert-card"
            href="#"
            class="alert-card"
            style="display: none;"
        >
            <span class="icon-badge size-md is-pending">
                <span class="icon icon-20" id="pending-alert-icon"></span>
            </span>

            <span class="alert-card-body">
                <span class="alert-card-label">需要處理</span>
                <span class="alert-card-title">
                    待確認預約
                    <span
                        class="alert-card-count"
                        id="pending-alert-count"
                    >0</span>
                </span>
            </span>

            <span class="icon icon-20 alert-card-chevron" id="pending-alert-chevron"></span>
        </a>


        <!-- 今日已完成（沒有 Pending、且所有 CONFIRMED 都已過去時顯示） -->
        <div
            id="completion-banner"
            class="completion-banner"
            style="display: none;"
        >
            <span class="icon-badge size-md is-success">
                <span class="icon icon-20" id="completion-icon"></span>
            </span>

            <span class="completion-banner-body">
                <div class="completion-banner-title">今日已完成</div>
                <div class="completion-banner-subtitle" id="completion-subtitle">今天的預約都完成了</div>
            </span>

            <span class="completion-banner-count" id="completion-count">0 / 0</span>
        </div>


        <!-- 下一位客人 -->
        <section class="app-section" id="next-customer-section" style="display: none;">

            <div class="app-section-header">
                <span class="text-section-title">下一位客人</span>
            </div>

            <a
                id="next-customer-card"
                href="#"
                class="next-card"
            >
                <span class="icon-badge size-lg is-calendar">
                    <span class="icon icon-20" id="next-customer-icon"></span>
                </span>

                <span class="next-card-body">
                    <span class="next-card-time" id="next-customer-time">--:--</span>
                    <div class="next-card-name" id="next-customer-name">--</div>
                    <div class="next-card-meta" id="next-customer-meta">--</div>
                </span>

                <span class="icon icon-18 next-card-chevron" id="next-customer-chevron"></span>
            </a>

        </section>


        <!-- 今日行程摘要 -->
        <section class="app-section">

            <div class="app-section-header">
                <span class="text-section-title" id="today-schedule-title">今日行程</span>
            </div>

            <div
                id="today-schedule-list"
                class="timeline-list"
            >
                <p class="state-message">載入中...</p>
            </div>

        </section>

    </main>


    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

        <a
            id="nav-today"
            href="admin.html"
            class="bottom-nav-item is-active"
        >
            <span class="icon bottom-nav-icon" id="nav-today-icon"></span>
            今日
        </a>

        <span
            id="nav-calendar"
            class="bottom-nav-item is-disabled"
        >
            <span class="icon bottom-nav-icon" id="nav-calendar-icon"></span>
            行事曆
        </span>

        <a
            id="nav-services"
            href="services.html"
            class="bottom-nav-item"
        >
            <span class="icon bottom-nav-icon" id="nav-services-icon"></span>
            服務
        </a>

        <a
            id="nav-management"
            href="staff.html"
            class="bottom-nav-item"
        >
            <span class="icon bottom-nav-icon" id="nav-management-icon"></span>
            管理
        </a>

    </nav>


    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="icons.js"></script>
    <script src="admin-common.js"></script>
    <script src="admin.js"></script>

</body>

</html>
