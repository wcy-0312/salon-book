<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SalonBook 服務管理</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >
</head>

<body>

    <main class="container">

        <header class="header">
            <div>
                <h1 id="services-staff-title">服務管理</h1>
                <p><a id="back-to-admin-link" href="admin.html">← 返回預約管理</a></p>
            </div>
        </header>


        <!-- 目前設計師的服務清單 -->
        <section class="section">

            <div class="section-header">
                <h2>提供的服務</h2>
            </div>

            <div
                id="service-list"
                class="service-list"
            >
                <p class="loading">
                    載入中...
                </p>
            </div>

        </section>


        <!-- 新增全新服務（不會自動指派給任何設計師） -->
        <section class="section">

            <div class="section-header">
                <h2>新增服務項目</h2>
            </div>

            <form
                id="service-form"
                class="service-form"
            >

                <label class="service-field">
                    名稱
                    <input
                        id="service-name"
                        type="text"
                        maxlength="50"
                        required
                    >
                </label>

                <button
                    type="submit"
                    class="service-submit"
                >
                    新增服務項目
                </button>

            </form>

            <p class="calendar-hint">
                新增後尚未指派給任何設計師，請在上方清單為需要提供這項服務的設計師設定價格與時間。
            </p>

        </section>

    </main>


    <!-- 編輯「該設計師的服務」彈窗 -->
    <div
        id="service-edit-overlay"
        class="service-edit-overlay hidden"
    >

        <div class="service-edit-dialog">

            <h2 id="service-edit-title">編輯服務</h2>

            <form id="service-edit-form">

                <label class="service-field service-field-checkbox">
                    <input
                        id="edit-service-offered"
                        type="checkbox"
                    >
                    提供這項服務
                </label>

                <div
                    id="service-edit-fields"
                    class="service-field-row"
                >

                    <label class="service-field">
                        價格
                        <input
                            id="edit-service-price"
                            type="number"
                            min="0"
                            step="1"
                        >
                    </label>

                    <label class="service-field">
                        所需時間（分鐘）
                        <input
                            id="edit-service-duration"
                            type="number"
                            min="1"
                            step="1"
                        >
                    </label>

                </div>

                <div class="service-edit-actions">

                    <button
                        type="button"
                        id="service-edit-cancel"
                        class="reject-button"
                    >
                        取消
                    </button>

                    <button
                        type="submit"
                        class="confirm-button"
                    >
                        儲存
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="services.js"></script>

</body>

</html>
